[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: necessite un service externe reel (base de donnees, cle API)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py312"]
